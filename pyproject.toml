[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-detect"
version = "0.1.0"
description = "Multi-platform path detection for AI agent skills — Hermes, OpenClaw, Claude Code, Codex, Cursor, VSCode"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "relunctance", email = "maomao@gql.ai"}
]
keywords = ["platform", "detection", "hermes", "openclaw", "claude-code", "agent", "skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/relunctance/platform-detect"
Repository = "https://github.com/relunctance/platform-detect"
Issues = "https://github.com/relunctance/platform-detect/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
